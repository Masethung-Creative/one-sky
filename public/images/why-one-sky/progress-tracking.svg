<svg xmlns="http://www.w3.org/2000/svg" class="osk5-root" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Progress tracking" style="--osk5-d:4s;overflow:visible"><style>
:where(.osk5-root *:not([transform])) { transform-box: fill-box; }
.osk5-root.is-paused * { animation-play-state: paused !important; }

/* Board float + gentle rock */
.osk5-board { transform-origin: 50% 100%; animation: osk5-float var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25%      { transform: translateY(-4px) rotate(-1.5deg); }
  50%      { transform: translateY(0) rotate(0deg); }
  75%      { transform: translateY(-3px) rotate(1.5deg); }
}

/* Bars grow one by one, then settle back down for the loop */
.osk5-bar { transform-origin: 50% 100%; animation: osk5-grow var(--osk5-d) cubic-bezier(.3,.7,.4,1) infinite backwards; }
.osk5-bar-2 { animation-delay: calc(var(--osk5-d) * .06); }
.osk5-bar-3 { animation-delay: calc(var(--osk5-d) * .12); }
.osk5-bar-4 { animation-delay: calc(var(--osk5-d) * .18); }
@keyframes osk5-grow {
  0%, 4% { transform: scaleY(.12); }
  14%    { transform: scaleY(1.12); }
  18%    { transform: scaleY(.95); }
  22%, 76% { transform: scaleY(1); }
  90%, 100% { transform: scaleY(.12); }
}
/* Live-chart breathing on the inner rect */
.osk5-bar-bob { transform-origin: 50% 100%; animation: osk5-bob calc(var(--osk5-d) / 4) ease-in-out infinite; }
.osk5-bar-2 .osk5-bar-bob { animation-delay: calc(var(--osk5-d) / -16); }
.osk5-bar-3 .osk5-bar-bob { animation-delay: calc(var(--osk5-d) / -8); }
.osk5-bar-4 .osk5-bar-bob { animation-delay: calc(var(--osk5-d) * -3 / 16); }
@keyframes osk5-bob { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.93); } }

/* Green ticks pop above each bar as it completes */
.osk5-check { transform-origin: 50% 100%; opacity: 0; animation: osk5-check var(--osk5-d) ease-out infinite backwards; }
.osk5-check-2 .osk5-check { animation-delay: calc(var(--osk5-d) * .06); }
.osk5-check-3 .osk5-check { animation-delay: calc(var(--osk5-d) * .12); }
.osk5-check-4 .osk5-check { animation-delay: calc(var(--osk5-d) * .18); }
@keyframes osk5-check {
  0%, 12% { opacity: 0; transform: translateY(6px) scale(0); }
  17%     { opacity: 1; transform: translateY(-4px) scale(1.2); }
  21%     { opacity: 1; transform: translateY(0) scale(1); }
  40%     { opacity: 1; transform: translateY(-3px) scale(1); }
  48%, 100% { opacity: 0; transform: translateY(-10px) scale(.8); }
}

/* Trend line draws, then keeps flowing */
.osk5-trend { stroke-dasharray: 110; animation: osk5-trend var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-trend {
  0%, 30% { stroke-dashoffset: 110; opacity: 1; }
  46%     { stroke-dashoffset: 0;   opacity: 1; }
  82%     { stroke-dashoffset: 0;   opacity: 1; }
  92%, 100% { stroke-dashoffset: 0; opacity: 0; }
}
.osk5-trend-flow { stroke-dasharray: 4 14; animation: osk5-flow calc(var(--osk5-d) / 4) linear infinite, osk5-flowfade var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-flow { from { stroke-dashoffset: 36; } to { stroke-dashoffset: 0; } }
@keyframes osk5-flowfade { 0%, 46% { opacity: 0; } 52%, 80% { opacity: .9; } 90%, 100% { opacity: 0; } }
.osk5-arrow { transform-origin: 30% 50%; animation: osk5-arrow var(--osk5-d) ease-out infinite; }
@keyframes osk5-arrow {
  0%, 44% { opacity: 0; transform: translateX(-4px) scale(0); }
  49%     { opacity: 1; transform: translateX(2px) scale(1.3); }
  53%     { opacity: 1; transform: translateX(0) scale(1); }
  60%     { opacity: 1; transform: translateX(3px) scale(1); }
  67%     { opacity: 1; transform: translateX(0) scale(1); }
  74%     { opacity: 1; transform: translateX(3px) scale(1); }
  82%     { opacity: 1; transform: translateX(0) scale(1); }
  92%, 100% { opacity: 0; transform: translateX(0) scale(.8); }
}

/* Star: slow continuous spin + burst */
.osk5-star-spin { transform-origin: 50% 50%; animation: osk5-spin calc(var(--osk5-d) * 2) linear infinite; }
@keyframes osk5-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.osk5-star { transform-origin: 50% 50%; animation: osk5-star var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-star {
  0%, 100% { transform: scale(.9); }
  20%      { transform: scale(1); }
  40%      { transform: scale(.9); }
  47%      { transform: scale(1.35); }
  53%      { transform: scale(.95); }
  58%      { transform: scale(1.08); }
  64%      { transform: scale(1); }
  82%      { transform: scale(1.04); }
}
.osk5-star-glow { transform-origin: 50% 50%; animation: osk5-glow var(--osk5-d) ease-out infinite; }
@keyframes osk5-glow {
  0%, 44% { opacity: 0; transform: scale(.5); }
  49%     { opacity: .6; transform: scale(1.1); }
  64%, 100% { opacity: 0; transform: scale(1.6); }
}
.osk5-star-rays { transform-origin: 50% 50%; animation: osk5-rays var(--osk5-d) ease-out infinite; }
@keyframes osk5-rays {
  0%, 45% { opacity: 0; transform: scale(.6); }
  50%     { opacity: 1; transform: scale(1); }
  60%, 100% { opacity: 0; transform: scale(1.3); }
}

/* Trophy: continuous sway, hop on the burst, shine sweep */
.osk5-trophy-sway { transform-origin: 50% 100%; animation: osk5-sway var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-sway {
  0%, 100% { transform: rotate(-4deg); }
  25%      { transform: rotate(4deg); }
  50%      { transform: rotate(-4deg); }
  75%      { transform: rotate(4deg); }
}
.osk5-trophy { transform-origin: 50% 100%; animation: osk5-trophy var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-trophy {
  0%, 52% { transform: translateY(0) scale(1,1); }
  55%     { transform: translateY(0) scale(1.08,.9); }
  60%     { transform: translateY(-12px) scale(.96,1.06); }
  65%     { transform: translateY(0) scale(1.06,.93); }
  69%     { transform: translateY(-3px) scale(1,1); }
  72%, 100% { transform: translateY(0) scale(1,1); }
}
.osk5-shine-band { animation: osk5-sweep var(--osk5-d) ease-in-out infinite; }
@keyframes osk5-sweep {
  0%, 56% { transform: translateX(-30px); opacity: 0; }
  58%     { opacity: .9; }
  70%     { transform: translateX(34px); opacity: .9; }
  72%, 100% { transform: translateX(34px); opacity: 0; }
}

/* Sparkles: twice per loop */
.osk5-sparkle { transform-origin: 50% 50%; opacity: 0; animation: osk5-sparkle calc(var(--osk5-d) / 2) ease-out infinite; }
.osk5-sparkle-2 .osk5-sparkle { animation-delay: calc(var(--osk5-d) / -6); }
.osk5-sparkle-3 .osk5-sparkle { animation-delay: calc(var(--osk5-d) / -3); }
@keyframes osk5-sparkle {
  0%      { opacity: 0; transform: scale(0) rotate(0); }
  15%     { opacity: 1; transform: scale(1.1) rotate(25deg); }
  30%     { opacity: .9; transform: scale(.8) rotate(40deg); }
  45%, 100% { opacity: 0; transform: scale(.6) rotate(50deg); }
}

.osk5-accent { transform-origin: 50% 50%; animation: osk5-accent calc(var(--osk5-d) / 2) ease-in-out infinite; }
@keyframes osk5-accent { 0%,100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.08); } }

@media (prefers-reduced-motion: reduce) {
  .osk5-root * { animation: none !important; }
  .osk5-star-glow, .osk5-star-rays, .osk5-sparkle, .osk5-check, .osk5-shine-band, .osk5-trend-flow { opacity: 0; }
}

/* Card shell */
.osk5-card {
  width: 260px; border-radius: 28px; padding: 18px 18px 26px;
  background: linear-gradient(#D6F0FF 0%, #E9F7FF 55%, #F3FBFF 100%);
  box-shadow: 0 10px 24px rgba(30, 80, 200, .18), inset 0 0 0 3px rgba(255,255,255,.7);
  text-align: center; font-family: &quot;Baloo 2&quot;, &quot;Nunito&quot;, system-ui, sans-serif;
}
.osk5-card h3 { margin: 4px 0 8px; font-size: 26px; line-height: 1.1; color: #14203D; font-weight: 800; }
.osk5-card p  { margin: 0; font-size: 16px; line-height: 1.45; color: #2B3550; }
