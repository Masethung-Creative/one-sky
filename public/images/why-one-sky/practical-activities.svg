<svg xmlns="http://www.w3.org/2000/svg" class="osk3-root" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Practical activities" style="--osk3-d:3s;overflow:visible"><style>
.osk3-root * { transform-box: fill-box; }
.osk3-root.is-paused * { animation-play-state: paused !important; }

/* Whole scene: idle float */
.osk3-scene { transform-origin: 50% 100%; animation: osk3-float var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-float {
  0%   { transform: translateY(0); }
  7%   { transform: translateY(-3px); }
  13%  { transform: translateY(0); }
  85%  { transform: translateY(-2px); }
  100% { transform: translateY(0); }
}

/* Scissors: rise out of the cup and snip twice */
.osk3-scissors { animation: osk3-rise var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-rise {
  0%, 13%  { transform: translateY(0); }
  17%, 30% { transform: translateY(-7px); }
  36%, 100% { transform: translateY(0); }
}
.osk3-scissor-left, .osk3-scissor-right { transform-box: view-box; transform-origin: 75px 104px; }
.osk3-scissor-left  { animation: osk3-snipL var(--osk3-d) ease-in-out infinite; }
.osk3-scissor-right { animation: osk3-snipR var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-snipL {
  0%, 15% { transform: rotate(0); } 18% { transform: rotate(-14deg); } 21% { transform: rotate(0); }
  25% { transform: rotate(-14deg); } 29%, 100% { transform: rotate(0); }
}
@keyframes osk3-snipR {
  0%, 15% { transform: rotate(0); } 18% { transform: rotate(14deg); } 21% { transform: rotate(0); }
  25% { transform: rotate(14deg); } 29%, 100% { transform: rotate(0); }
}
.osk3-snip-lines { transform-origin: 50% 100%; animation: osk3-pop var(--osk3-d) ease-out infinite; }
@keyframes osk3-pop {
  0%, 20% { opacity: 0; transform: scale(.4); }
  23%     { opacity: 1; transform: scale(1); }
  31%     { opacity: 0; transform: scale(1.2); }
  100%    { opacity: 0; }
}

/* Red block hops and lands back on the stack */
.osk3-block-red { transform-origin: 50% 100%; animation: osk3-hop var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-hop {
  0%, 33% { transform: translateY(0) rotate(0) scale(1,1); }
  37%     { transform: translateY(-20px) rotate(-6deg) scale(1,1); animation-timing-function: ease-in; }
  42%     { transform: translateY(0) rotate(0) scale(1,1); }
  44%     { transform: translateY(0) rotate(0) scale(1.05,.9); }
  47%     { transform: translateY(0) rotate(0) scale(.98,1.03); }
  50%, 100% { transform: translateY(0) rotate(0) scale(1,1); }
}
.osk3-block-yellow, .osk3-block-blue { transform-origin: 50% 100%; animation: osk3-thud var(--osk3-d) ease-out infinite; }
@keyframes osk3-thud {
  0%, 42% { transform: scale(1,1); } 44% { transform: scale(1.02,.96); } 48%, 100% { transform: scale(1,1); }
}

/* Pencil wiggles while the squiggle draws */
.osk3-pencil-move { transform-origin: 0% 50%; animation: osk3-draw var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-draw {
  0%, 46% { transform: rotate(0) translateX(0); }
  50% { transform: rotate(-3deg) translateX(2px); }
  54% { transform: rotate(2deg) translateX(4px); }
  58% { transform: rotate(-3deg) translateX(6px); }
  62% { transform: rotate(1deg) translateX(7px); }
  70%, 100% { transform: rotate(0) translateX(0); }
}
.osk3-squiggle { stroke-dasharray: 60; animation: osk3-squiggle var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-squiggle {
  0%, 46% { stroke-dashoffset: 60; opacity: 1; }
  64%     { stroke-dashoffset: 0;  opacity: 1; }
  82%     { stroke-dashoffset: 0;  opacity: 1; }
  92%, 100% { stroke-dashoffset: 0; opacity: 0; }
}

/* Glue bottle squeeze + drop */
.osk3-glue { transform-origin: 50% 100%; animation: osk3-squeeze var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-squeeze {
  0%, 57% { transform: scale(1,1); }
  61%     { transform: scale(1.07,.93); }
  65%     { transform: scale(.98,1.03); }
  69%, 100% { transform: scale(1,1); }
}
.osk3-glue-drop { transform-origin: 50% 100%; animation: osk3-drop var(--osk3-d) ease-out infinite; }
@keyframes osk3-drop {
  0%, 60% { opacity: 0; transform: translateY(4px) scale(0); }
  65%     { opacity: 1; transform: translateY(-3px) scale(1); }
  74%     { opacity: 1; transform: translateY(-5px) scale(.9); }
  80%, 100% { opacity: 0; transform: translateY(-6px) scale(.8); }
}

/* Sparkles */
.osk3-sparkle { transform-origin: 50% 50%; opacity: 0; animation: osk3-sparkle var(--osk3-d) ease-out infinite; }
.osk3-sparkle-2 .osk3-sparkle { animation-delay: calc(var(--osk3-d) * .03); }
.osk3-sparkle-3 .osk3-sparkle { animation-delay: calc(var(--osk3-d) * .06); }
@keyframes osk3-sparkle {
  0%, 64% { opacity: 0; transform: scale(0) rotate(0); }
  71%     { opacity: 1; transform: scale(1) rotate(20deg); }
  78%     { opacity: .9; transform: scale(.8) rotate(30deg); }
  84%, 100% { opacity: 0; transform: scale(.8) rotate(35deg); }
}

.osk3-accent { transform-origin: 50% 50%; animation: osk3-accent var(--osk3-d) ease-in-out infinite; }
@keyframes osk3-accent { 0%,100% { opacity: .55; transform: scale(.92); } 50% { opacity: 1; transform: scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .osk3-root * { animation: none !important; }
  .osk3-glue-drop, .osk3-snip-lines, .osk3-sparkle { opacity: 0; }
}

/* Card shell */
.osk3-card {
  width: 260px; border-radius: 28px; padding: 18px 18px 26px;
  background: linear-gradient(#D9F4E2 0%, #ECFAF1 55%, #F4FCF7 100%);
  box-shadow: 0 10px 24px rgba(30, 80, 200, .18), inset 0 0 0 3px rgba(255,255,255,.7);
  text-align: center; font-family: &quot;Baloo 2&quot;, &quot;Nunito&quot;, system-ui, sans-serif;
}
.osk3-card h3 { margin: 4px 0 8px; font-size: 26px; line-height: 1.1; color: #14203D; font-weight: 800; }
.osk3-card p  { margin: 0; font-size: 16px; line-height: 1.45; color: #2B3550; }
