" stroke-width="2" stroke-linejoin="round"></path><path d="M66 92 L74 78 L78 92 Z" fill="#FFC93C" stroke="#FFC93C" stroke-width="2" stroke-linejoin="round"></path><circle cx="66.5" cy="91" r="4" fill="#F2B01E"></circle></g></g><circle class="osk4-face" cx="92" cy="120" r="32" fill="#FFD9BF"></circle><circle cx="61" cy="122" r="6" fill="#FFD9BF"></circle><path class="osk4-hair" d="M58 122 Q54 84 92 82 Q130 84 126 118 Q118 104 104 100 Q100 110 84 108 Q72 110 64 120 Q61 124 58 122 Z" fill="#4A2E26"></path><g class="osk4-eye osk4-eye-left"><ellipse cx="86" cy="124" rx="4.5" ry="5.6" fill="#2B1B17"></ellipse><circle cx="87.6" cy="122" r="1.7" fill="#FFFFFF"></circle></g><g class="osk4-eye osk4-eye-right"><ellipse cx="106" cy="124" rx="4.5" ry="5.6" fill="#2B1B17"></ellipse><circle cx="107.6" cy="122" r="1.7" fill="#FFFFFF"></circle></g><path class="osk4-mouth" d="M90 135 Q97 145 104 135 Z" fill="#E8645A" stroke="#E8645A" stroke-width="2" stroke-linejoin="round"></path><circle class="osk4-cheek osk4-cheek-left" cx="77" cy="134" r="5" fill="#FF9DB0" opacity=".55"></circle><circle class="osk4-cheek osk4-cheek-right" cx="115" cy="133" r="5" fill="#FF9DB0" opacity=".55"></circle></g><path class="osk4-arm" d="M120 180 Q126 162 118 152" stroke="#FFC93C" stroke-width="13" stroke-linecap="round" fill="none"></path><g class="osk4-hand"><ellipse cx="114" cy="148" rx="10" ry="8" transform="rotate(-25 114 148)" fill="#FFD9BF"></ellipse></g></g><g class="osk4-laptop"><path class="osk4-laptop-lid" d="M132 122 L186 114 Q190 114 190 118 L194 168 L138 176 Z" fill="#3B7BEA" stroke="#3B7BEA" stroke-width="3" stroke-linejoin="round"></path><path class="osk4-screen-glow" d="M132 122 L186 114 Q190 114 190 118 L194 168 L138 176 Z" fill="#9CC2FF"></path><path d="M140 128 L150 127 L153 168 L144 169 Z" fill="#6FA3F5" opacity=".45"></path><g class="osk4-cloud-logo" fill="#FFFFFF"><circle cx="158" cy="148" r="6"></circle><circle cx="166" cy="144" r="8"></circle><circle cx="174" cy="148" r="6"></circle><rect x="152" y="148" width="28" height="6" rx="3"></rect></g><path class="osk4-laptop-base" d="M122 178 L198 168 Q204 168 205 172 L206 176 L128 188 Q122 188 122 184 Z" fill="#2F5BD8"></path></g><g class="osk4-bits"><g transform="translate(150 104)"><path class="osk4-bit osk4-bit-1" d="M0 -8 L2 -2.7 L7.6 -2.5 L3.2 1 L4.7 6.5 L0 3.4 L-4.7 6.5 L-3.2 1 L-7.6 -2.5 L-2 -2.7 Z" fill="#FFC93C" stroke="#FFC93C" stroke-width="1.5" stroke-linejoin="round"></path></g><g transform="translate(166 100)"><g class="osk4-bit osk4-bit-2"><circle cx="0" cy="0" r="8" fill="#4CC07A"></circle><path d="M-3.5 0 L-1 2.8 L4 -2.8" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path></g></g><g transform="translate(180 104)"><path class="osk4-bit osk4-bit-3" d="M0 7 C-9 1 -8 -6 -3.5 -6 C-1.5 -6 0 -4.5 0 -3 C0 -4.5 1.5 -6 3.5 -6 C8 -6 9 1 0 7 Z" fill="#FF7FA6"></path></g></g></g></svg>