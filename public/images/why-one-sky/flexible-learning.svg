<svg xmlns="http://www.w3.org/2000/svg" class="osk4-root" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Flexible learning" style="--osk4-d:4s;overflow:visible"><style>
:where(.osk4-root *:not([transform])) { transform-box: fill-box; }
.osk4-root.is-paused * { animation-play-state: paused !important; }

/* Girl + laptop float */
.osk4-scene { transform-origin: 50% 100%; animation: osk4-float var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-float {
  0%, 100% { transform: translateY(0); }
  25%      { transform: translateY(-4px); }
  50%      { transform: translateY(0); }
  75%      { transform: translateY(-3px); }
}

/* Clock: swing + alarm shake */
.osk4-clock { transform-origin: 50% 50%; animation: osk4-clock var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-clock {
  0%, 100% { transform: rotate(-6deg) scale(1); }
  20%      { transform: rotate(6deg) scale(1); }
  38%      { transform: rotate(0deg) scale(1); }
  41%      { transform: rotate(-12deg) scale(1.12); }
  44%      { transform: rotate(12deg) scale(1.12); }
  47%      { transform: rotate(-10deg) scale(1.1); }
  50%      { transform: rotate(10deg) scale(1.08); }
  53%      { transform: rotate(-4deg) scale(1.02); }
  57%      { transform: rotate(0deg) scale(1); }
  80%      { transform: rotate(-6deg) scale(1); }
}
.osk4-minute-hand { transform-box: view-box; transform-origin: 182px 60px; animation: osk4-turn var(--osk4-d) linear infinite; }
.osk4-hour-hand   { transform-box: view-box; transform-origin: 182px 60px; animation: osk4-turn calc(var(--osk4-d) * 12) linear infinite; }
@keyframes osk4-turn { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.osk4-clock-ticks { transform-origin: 50% 50%; animation: osk4-ticks var(--osk4-d) ease-out infinite; }
@keyframes osk4-ticks {
  0%, 39% { opacity: 0; transform: scale(.5); }
  43%     { opacity: 1; transform: scale(1); }
  52%     { opacity: 1; transform: scale(1.1); }
  60%, 100% { opacity: 0; transform: scale(1.25); }
}

/* Head bob, ponytail swing, blink, smile */
.osk4-head { transform-box: view-box; transform-origin: 92px 152px; animation: osk4-bob var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-bob {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  25%      { transform: rotate(7deg) translateY(-1px); }
  50%      { transform: rotate(0deg) translateY(0); }
  75%      { transform: rotate(-5deg) translateY(-1px); }
}
.osk4-ponytail { transform-box: view-box; transform-origin: 66px 96px; animation: osk4-swing var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-swing {
  0%, 100% { transform: rotate(4deg); }
  25%      { transform: rotate(-14deg); }
  50%      { transform: rotate(6deg); }
  75%      { transform: rotate(-8deg); }
}
.osk4-bow { transform-origin: 50% 50%; animation: osk4-bow calc(var(--osk4-d) / 2) ease-in-out infinite; }
@keyframes osk4-bow { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.12) rotate(-8deg); } }
.osk4-eye { transform-origin: 50% 50%; animation: osk4-blink var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-blink {
  0%, 16% { transform: scaleY(1); } 18% { transform: scaleY(.1); } 20% { transform: scaleY(1); }
  64% { transform: scaleY(1); } 66% { transform: scaleY(.1); } 68%, 100% { transform: scaleY(1); }
}
.osk4-mouth { transform-origin: 50% 0%; animation: osk4-smile var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-smile { 0%, 35% { transform: scale(1); } 45%, 60% { transform: scale(1.25, 1.35); } 70%, 100% { transform: scale(1); } }
.osk4-cheek { animation: osk4-cheek var(--osk4-d) ease-in-out infinite; }
@keyframes osk4-cheek { 0%, 35% { opacity: .5; } 45%, 62% { opacity: 1; } 72%, 100% { opacity: .5; } }
.osk4-hand { transform-origin: 50% 100%; animation: osk4-tap calc(var(--osk4-d) / 4) ease-in-out infinite; }
@keyframes osk4-tap { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }

/* Learning bits float up from the laptop, one after another */
.osk4-bit { opacity: 0; transform-origin: 50% 50%; animation: osk4-rise var(--osk4-d) ease-out infinite; }
.osk4-bit-2 { animation-delay: calc(var(--osk4-d) / -3); }
.osk4-bit-3 { animation-delay: calc(var(--osk4-d) / -1.5); }
@keyframes osk4-rise {
  0%   { opacity: 0; transform: translate(0, 18px) scale(.3) rotate(0deg); }
  10%  { opacity: 1; transform: translate(0, 0) scale(1.1) rotate(-6deg); }
  20%  { opacity: 1; transform: translate(-6px, -18px) scale(1) rotate(4deg); }
  30%  { opacity: 1; transform: translate(4px, -34px) scale(.95) rotate(-4deg); }
  38%  { opacity: 0; transform: translate(-2px, -46px) scale(.85) rotate(0deg); }
  100% { opacity: 0; transform: translate(-2px, -46px) scale(.85); }
}
.osk4-cloud-logo { transform-origin: 50% 50%; animation: osk4-logo calc(var(--osk4-d) / 3) ease-in-out infinite; }
@keyframes osk4-logo { 0%, 100% { transform: scale(1); } 10% { transform: scale(1.18); } 25% { transform: scale(1); } }
.osk4-screen-glow { animation: osk4-glow calc(var(--osk4-d) / 3) ease-in-out infinite; }
@keyframes osk4-glow { 0%, 100% { opacity: 0; } 10% { opacity: .6; } 30% { opacity: 0; } }

.osk4-accent { transform-origin: 50% 50%; animation: osk4-accent calc(var(--osk4-d) / 2) ease-in-out infinite; }
@keyframes osk4-accent { 0%,100% { opacity: .5; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.05); } }

@media (prefers-reduced-motion: reduce) {
  .osk4-root * { animation: none !important; }
  .osk4-clock-ticks, .osk4-screen-glow { opacity: 0; }
  .osk4-bit-1 { opacity: 1; transform: translateY(-14px); }
}

/* Card shell */
.osk4-card {
  width: 260px; border-radius: 28px; padding: 18px 18px 26px;
  background: linear-gradient(#E6DEFF 0%, #F1ECFF 55%, #F7F4FF 100%);
  box-shadow: 0 10px 24px rgba(30, 80, 200, .18), inset 0 0 0 3px rgba(255,255,255,.7);
  text-align: center; font-family: &quot;Baloo 2&quot;, &quot;Nunito&quot;, system-ui, sans-serif;
}
.osk4-card h3 { margin: 4px 0 8px; font-size: 26px; line-height: 1.1; color: #14203D; font-weight: 800; }
.osk4-card p  { margin: 0; font-size: 16px; line-height: 1.45; color: #2B3550; }
