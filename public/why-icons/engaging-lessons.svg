<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="t d">
  <title id="t">Engaging lessons</title>
  <desc id="d">An open storybook with a pop-up castle, a rocket launching out of it and twinkling stars.</desc>
  <style>
    #book, #page-turn, #castle, #rocket-fly, #rocket-flame, #rocket-trail, .star, .accent, #star-main-inner {
      transform-box: fill-box;
    }

    /* Book: idle float + small kick when the rocket launches */
    #book { transform-origin: 50% 100%; animation: book 3s ease-in-out infinite; }
    @keyframes book {
      0%   { transform: translateY(0) scale(1,1); }
      7%   { transform: translateY(-3px) scale(1,1); }
      13%  { transform: translateY(0) scale(1,1); }
      40%  { transform: translateY(0) scale(1,1); }
      43%  { transform: translateY(1px) scale(1.015,0.97); }
      47%  { transform: translateY(-2px) scale(0.995,1.015); }
      51%  { transform: translateY(0) scale(1,1); }
      82%  { transform: translateY(-2px) scale(1,1); }
      100% { transform: translateY(0) scale(1,1); }
    }

    /* Page turn: sweeps from the spine across to the left page, then fades */
    #page-turn { transform-origin: 0% 50%; opacity: 0; animation: pageTurn 3s ease-in-out infinite; }
    @keyframes pageTurn {
      0%, 13% { opacity: 0; transform: scaleX(0.15); }
      15%     { opacity: 1; transform: scaleX(0.12); }
      21%     { opacity: 1; transform: scaleX(0.01); }
      30%     { opacity: 1; transform: scaleX(-1); }
      33%     { opacity: 1; transform: scaleX(-1); }
      39%     { opacity: 0; transform: scaleX(-1); }
      100%    { opacity: 0; transform: scaleX(0.15); }
    }

    /* Castle pops up after the page lands */
    #castle { transform-origin: 50% 100%; animation: castle 3s ease-in-out infinite; }
    @keyframes castle {
      0%, 30% { transform: scale(1,1); }
      33%     { transform: scale(1.04,0.88); }
      38%     { transform: scale(0.97,1.08); }
      43%     { transform: scale(1,1); }
      100%    { transform: scale(1,1); }
    }

    /* Rocket: hidden behind the pages, launches out, hovers, flies off, resets */
    #rocket-fly { animation: rocket 3s infinite; }
    @keyframes rocket {
      0%, 36% { opacity: 1; transform: translateY(62px); animation-timing-function: cubic-bezier(.3,.6,.4,1); }
      55%     { opacity: 1; transform: translateY(-6px); animation-timing-function: ease-in-out; }
      64%     { opacity: 1; transform: translateY(-2px); }
      74%     { opacity: 1; transform: translateY(-7px); animation-timing-function: ease-in; }
      86%     { opacity: 0; transform: translateY(-28px); }
      88%     { opacity: 0; transform: translateY(62px); }
      92%     { opacity: 1; transform: translateY(62px); }
      100%    { opacity: 1; transform: translateY(62px); }
    }
    #rocket-flame { transform-origin: 50% 0%; animation: flame .25s ease-in-out infinite alternate; }
    @keyframes flame { from { transform: scaleY(.8); } to { transform: scaleY(1.15); } }

    #rocket-trail path { stroke-dasharray: 70; animation: trail 3s ease-out infinite; }
    @keyframes trail {
      0%, 38% { stroke-dashoffset: 70; opacity: 0; }
      40%     { stroke-dashoffset: 70; opacity: 1; }
      55%     { stroke-dashoffset: 0;  opacity: 1; }
      72%     { stroke-dashoffset: 0;  opacity: 0; }
      100%    { stroke-dashoffset: 0;  opacity: 0; }
    }

    /* Big smiling star: gentle wobble all the time */
    #star-main-inner { transform-origin: 50% 50%; animation: wobble 3s ease-in-out infinite; }
    @keyframes wobble {
      0%, 100% { transform: rotate(-6deg) scale(1); }
      50%      { transform: rotate(6deg) scale(1.06); }
    }

    /* Small stars twinkle after launch */
    .star { transform-origin: 50% 50%; animation: twinkle 3s ease-out infinite; }
    #star-a .star { animation-delay: 0s; }
    #star-b .star { animation-delay: .1s; }
    #star-c .star { animation-delay: .2s; }
    @keyframes twinkle {
      0%, 56% { transform: scale(.75) rotate(0deg); opacity: .6; }
      63%     { transform: scale(1.15) rotate(18deg); opacity: 1; }
      70%     { transform: scale(.9) rotate(28deg); opacity: 1; }
      80%     { transform: scale(.75) rotate(36deg); opacity: .6; }
      100%    { transform: scale(.75) rotate(36deg); opacity: .6; }
    }

    .accent { transform-origin: 50% 50%; animation: accent 3s ease-in-out infinite; }
    @keyframes accent { 0%,100% { opacity: .55; transform: scale(.92) } 50% { opacity: 1; transform: scale(1) } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      #rocket-fly { transform: translateY(-6px); }
      #page-turn { opacity: 0; }
    }
  </style>

  <defs>
    <path id="star5" d="M0 -10 L2.47 -3.4 L9.51 -3.09 L4 1.3 L5.88 8.09 L0 4.2 L-5.88 8.09 L-4 1.3 L-9.51 -3.09 L-2.47 -3.4 Z"/>
  </defs>

  <!-- Soft pink-cream cloud base -->
  <g id="base-cloud">
    <ellipse cx="120" cy="206" rx="90" ry="13" fill="#FFE8EF"/>
    <circle cx="60"  cy="202" r="14" fill="#FFE8EF"/>
    <circle cx="94"  cy="197" r="18" fill="#FFE8EF"/>
    <circle cx="146" cy="197" r="18" fill="#FFE8EF"/>
    <circle cx="180" cy="202" r="14" fill="#FFE8EF"/>
    <ellipse cx="120" cy="200" rx="70" ry="6" fill="#F5B9CB" opacity=".45"/>
  </g>

  <!-- Accent marks -->
  <g id="accent-marks" stroke="#F06A93" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path class="accent" d="M18 150 l9 3 M17 162 l9 0"/>
    <path class="accent" d="M222 150 l-9 3 M223 162 l-9 0"/>
  </g>

  <!-- Rocket (drawn before the book so it emerges from behind the pages) -->
  <g id="rocket" transform="translate(152 60) rotate(35)">
    <g id="rocket-fly">
      <g id="rocket-flame">
        <path d="M-5 12 Q0 28 5 12 Z" fill="#FFA726"/>
        <path d="M-2.5 12 Q0 21 2.5 12 Z" fill="#FFE27A"/>
      </g>
      <path id="rocket-fin-left"  d="M-7 3 L-14 15 L-7 12 Z" fill="#F2675A"/>
      <path id="rocket-fin-right" d="M7 3 L14 15 L7 12 Z" fill="#F2675A"/>
      <path id="rocket-body" d="M0 -22 C9 -14 10 4 7 12 L-7 12 C-10 4 -9 -14 0 -22 Z" fill="#FFFFFF" stroke="#D5DCF0" stroke-width="1.5"/>
      <path id="rocket-nose" d="M0 -22 C5 -18 7 -14 7.6 -11 L-7.6 -11 C-7 -14 -5 -18 0 -22 Z" fill="#F2675A"/>
      <circle id="rocket-window" cx="0" cy="-3" r="4.6" fill="#5B9BF5" stroke="#2F5BD8" stroke-width="2"/>
    </g>
  </g>

  <!-- Book -->
  <g id="book">
    <path id="book-cover" d="M28 92 Q76 78 120 95 Q164 78 212 92 L212 178 Q164 166 120 184 Q76 166 28 178 Z" fill="#2F5BD8"/>
    <path id="page-stack" d="M33 94 Q78 82 120 98 Q162 82 207 94 L207 172 Q162 161 120 177 Q78 161 33 172 Z" fill="#DCE5F7"/>

    <g id="page-left">
      <path d="M38 94 Q80 84 118 99 L118 170 Q80 157 38 166 Z" fill="#F5FAFF"/>
      <path d="M38 148 Q66 128 96 142 Q108 148 118 150 L118 170 Q80 157 38 166 Z" fill="#7BCB6B"/>
      <g id="tree">
        <rect x="66" y="132" width="5" height="12" rx="2" fill="#A0673E"/>
        <circle cx="68.5" cy="128" r="10" fill="#4FAF55"/>
        <circle cx="64" cy="125" r="3.5" fill="#7BD07A"/>
      </g>
      <g id="page-cloud" fill="#DCEEFF">
        <circle cx="52" cy="108" r="5"/><circle cx="59" cy="105" r="7"/><circle cx="67" cy="108" r="5"/>
      </g>
    </g>

    <g id="page-right">
      <path d="M122 99 Q160 84 202 94 L202 166 Q160 157 122 170 Z" fill="#F5FAFF"/>
      <g id="castle">
        <rect x="136" y="110" width="12" height="42" rx="2" fill="#FFE2B8"/>
        <path d="M133.5 112 L142 96 L150.5 112 Z" fill="#F2675A" stroke="#F2675A" stroke-width="2" stroke-linejoin="round"/>
        <rect x="174" y="110" width="12" height="42" rx="2" fill="#FFE2B8"/>
        <path d="M171.5 112 L180 96 L188.5 112 Z" fill="#F2675A" stroke="#F2675A" stroke-width="2" stroke-linejoin="round"/>
        <rect x="146" y="118" width="30" height="34" fill="#FFD9A6"/>
        <rect x="153" y="100" width="16" height="22" rx="2" fill="#FFE2B8"/>
        <path d="M150.5 102 L161 84 L171.5 102 Z" fill="#F2675A" stroke="#F2675A" stroke-width="2" stroke-linejoin="round"/>
        <path d="M161 84 V75 L168 78 L161 81" fill="#FFC93C" stroke="#E2A31A" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M155 152 V143 A6 6 0 0 1 167 143 V152 Z" fill="#B8543F"/>
        <rect x="139.5" y="120" width="5" height="7" rx="2.5" fill="#5B78D6"/>
        <rect x="177.5" y="120" width="5" height="7" rx="2.5" fill="#5B78D6"/>
        <rect x="158.5" y="106" width="5" height="7" rx="2.5" fill="#5B78D6"/>
      </g>
      <path d="M122 154 Q152 138 202 148 L202 166 Q160 157 122 170 Z" fill="#6CC05E"/>
    </g>

    <path id="spine" d="M120 98 L120 177" stroke="#C9D4EE" stroke-width="2.5" stroke-linecap="round"/>

    <path id="page-turn" d="M122 99 Q160 84 202 94 L202 166 Q160 157 122 170 Z" fill="#EAF2FF" stroke="#D5DFF3" stroke-width="1.5"/>
  </g>

  <!-- Launch swoosh -->
  <g id="rocket-trail" fill="none" stroke="#FFC2D4" stroke-width="5" stroke-linecap="round">
    <path d="M121 96 Q126 76 144 68"/>
  </g>

  <!-- Stars -->
  <g id="star-main" transform="translate(52 62)">
    <g id="star-main-inner">
      <use href="#star5" transform="scale(1.9)" fill="#FFC93C" stroke="#FFC93C" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="-4" cy="-1" r="1.8" fill="#3B2A4A"/>
      <circle cx="4"  cy="-1" r="1.8" fill="#3B2A4A"/>
      <path d="M-3.5 4 Q0 7.5 3.5 4" stroke="#3B2A4A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="-7" cy="3" r="2" fill="#FF8FB0" opacity=".7"/>
      <circle cx="7"  cy="3" r="2" fill="#FF8FB0" opacity=".7"/>
    </g>
  </g>
  <g id="star-a" transform="translate(92 42)"><g class="star"><use href="#star5" transform="scale(.75)" fill="#FFD95A" stroke="#FFD95A" stroke-width="2" stroke-linejoin="round"/></g></g>
  <g id="star-b" transform="translate(200 58)"><g class="star"><use href="#star5" transform="scale(.9)" fill="#FFC93C" stroke="#FFC93C" stroke-width="2" stroke-linejoin="round"/></g></g>
  <g id="star-c" transform="translate(212 104)"><g class="star"><use href="#star5" transform="scale(.65)" fill="#FFD95A" stroke="#FFD95A" stroke-width="2" stroke-linejoin="round"/></g></g>
</svg>
